name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Add camera permission and libraries
        working-directory: CutebotAndroidSample
        run: |
          grep -q 'permission.CAMERA' app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' app/src/main/AndroidManifest.xml
          grep -q 'camera-core' app/build.gradle.kts || sed -i 's|    testImplementation(libs.junit)|    implementation("androidx.camera:camera-core:1.4.2")\n    implementation("androidx.camera:camera-camera2:1.4.2")\n    implementation("androidx.camera:camera-lifecycle:1.4.2")\n    testImplementation(libs.junit)|' app/build.gradle.kts
      - name: Build
        working-directory: CutebotAndroidSample
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cutebot-apk
          path: CutebotAndroidSample/app/build/outputs/apk/debug/*.apk
